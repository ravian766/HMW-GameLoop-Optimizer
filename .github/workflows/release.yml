name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.1, leave empty for auto-increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Test & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $manualVersion = "${{ github.event.inputs.version }}"
          $ref = "${{ github.ref }}"
          $runNumber = "${{ github.run_number }}"

          # Read base version from .csproj
          [xml]$proj = Get-Content "src/GameLoopOptimizer/GameLoopOptimizer.csproj"
          $baseVersion = $proj.Project.PropertyGroup.Version
          if (-not $baseVersion) { $baseVersion = "2.0.0" }

          if ($manualVersion) {
              $version = $manualVersion.TrimStart('v')
              $tag = "v$version"
              $isPreRelease = $false
          } elseif ($ref -like "refs/tags/v*") {
              $tag = $ref.Substring("refs/tags/".Length)
              $version = $tag.TrimStart('v')
              $isPreRelease = $false
          } else {
              # Branch push: Auto-version with build run number
              $version = "$baseVersion.$runNumber"
              $tag = "v$version"
              $isPreRelease = $true
          }

          Write-Host "Determined Version: $version"
          Write-Host "Determined Tag: $tag"
          Write-Host "Is PreRelease: $isPreRelease"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPreRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Dependencies
        run: dotnet restore GameLoopOptimizer.sln

      - name: Run Unit Tests
        run: dotnet test tests/GameLoopOptimizer.Tests/GameLoopOptimizer.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish Application
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          dotnet publish src/GameLoopOptimizer/GameLoopOptimizer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o ./publish_out `
            /p:Version=$ver `
            /p:AssemblyVersion=$ver `
            /p:FileVersion=$ver `
            /p:InformationalVersion=$ver

      - name: Create Release ZIP Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $zipName = "GameLoopOptimizer-v$ver-win-x64.zip"
          Compress-Archive -Path ./publish_out/* -DestinationPath "./$zipName" -CompressionLevel Optimal
          Write-Host "Created archive: $zipName"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "GameLoop Optimizer ${{ steps.get_version.outputs.tag }}"
          files: ./${{ steps.package.outputs.zip_name }}
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'True' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
